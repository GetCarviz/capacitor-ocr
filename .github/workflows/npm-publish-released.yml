# Publishes the package to GitHub Packages (npm.pkg.github.com) when a release is published.
# `npm publish` runs the `prepublishOnly` script, which builds dist/ before packing.

name: Publish Released Package

on:
  release:
    types: [released]
  workflow_dispatch:

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@getcarviz'
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
